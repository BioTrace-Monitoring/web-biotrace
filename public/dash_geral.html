<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioTrace - Análise Preditiva e Saúde de Lotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="./css/style_dash_geral.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-title">BioTrace</span>
        <span style="color:#CBD5E1;">|</span>
        <span class="header-subtitle"></span>
      </div>
      <div class="user-profile">
        <div class="user-avatar">LP</div>
        <span>Luís Phelipe · Engenheiro de Hardware</span>
      </div>
    </header>

    <!-- Barra de Filtro Global de Lote -->
    <section class="global-filter-card">
      <div class="batch-select-wrapper">
        <label for="selectLoteGlobal">Selecionar Lote para Análise</label>
        <select id="selectLoteGlobal" class="batch-select" onchange="mudarLoteGlobal(this.value)"></select>
      </div>
      <div class="filter-meta" id="filterMeta"></div>
    </section>

    <!-- Grid de Gráficos Analíticos -->
    <div class="dashboard-grid">
      <!-- Card 1: Gráfico de Pizza (Saúde do Lote) -->
      <div class="dashboard-card">
        <div class="card-header">
          <h3>Proporção de Alertas</h3>
          <p>Status atual dos componentes</p>
        </div>
        <div class="chart-container-wrapper">
          <canvas id="pizzaLoteCanvas"></canvas>
        </div>
        <div class="batch-summary-footer" id="batchSummaryFooter"></div>
      </div>

      <!-- Card 2: Gráfico de Tendência e Regressão Linear (Forecasting) -->
      <div class="dashboard-card">
        <div class="card-header">
          <h3>Previsão de Degradação (CPU/Temp)</h3>
          <p>Histórico real + Projeção de limite crítico</p>
        </div>
        <div class="chart-container-wrapper">
          <canvas id="forecastingCanvas"></canvas>
        </div>
        <div class="forecasting-footer" id="forecastingFooter"></div>
      </div>
    </div>
  </div>

  <script src="./js/dash_geral.js"></script>
</body>
</html>

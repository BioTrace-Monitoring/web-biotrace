<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visão Geral | BioTrace</title>
    <link rel="icon" href="../assets/icons/BioTrace (4).png" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
    <script src="../js/sessao.js"></script>
    <script>exigirCargo(["Administrador", "Gestor", "Analista"]);</script>
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="logo">
                    <img src="../assets/icons/BioTrace (4).png" alt="BioTrace Logo">
                </a>
                <button class="sidebar-close" id="sidebarClose">&times;</button>
            </div>

            <nav class="sidebar-nav">
                <span class="nav-title">Principal</span>
                <a href="index.html" class="nav-item active"><span class="nav-icon">📊</span> Visão Geral</a>

                <a href="#" class="nav-item active">
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span onclick="window.location.href='painel-cliente.html'">Acessar painel</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div id="usuario_avatar" class="usuario-avatar">BT</div>
                <div class="user-info">
                    <strong id="nome_cliente">Usuário BioTrace</strong>
                    <span id="email_cliente">perfil@biotrace.com</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="mobile-header">
                <button class="menu-button" id="menuButton" aria-label="Abrir menu">☰</button>
                <img src="../assets/icons/BioTrace (4).png" alt="BioTrace" class="mobile-logo">
            </header>

            <div class="page-content">
                <div class="page-heading">
                    <div>
                        <div class="eyebrow"><span class="eyebrow-dot"></span>PAINEL DE OBSERVABILIDADE</div>
                        <h1>Visão Geral</h1>
                        <p>Acompanhe a infraestrutura, os incidentes e os lotes da sua empresa.</p>
                    </div>
                </div>

                
            </div>
        </main>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script>
        let idUsuario = localStorage.getItem('ID_USUARIO');
        let nomeUsuario = localStorage.getItem('NOME_USUARIO');
        let emailUsuario = localStorage.getItem('EMAIL_USUARIO');
        let cargoUsuario = localStorage.getItem('CARGO_USUARIO');

        document.getElementById('nome_cliente').textContent = nomeUsuario;
        document.getElementById('email_cliente').textContent = emailUsuario;
        let avatar_default = nomeUsuario[0] + nomeUsuario[nomeUsuario.indexOf(' ') + 1];
        document.getElementById('usuario_avatar').textContent = avatar_default.toUpperCase();

        const sidebar = document.getElementById('sidebar');
        const menuButton = document.getElementById('menuButton');
        const sidebarClose = document.getElementById('sidebarClose');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function abrirSidebar() {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('active');
        }


        function fecharSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        }

        menuButton.addEventListener('click', abrirSidebar);

        sidebarClose.addEventListener('click', fecharSidebar);

        sidebarOverlay.addEventListener('click', fecharSidebar);
    </script>
</body>
</html>

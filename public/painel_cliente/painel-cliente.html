<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Início</title>
    <link rel="icon" href="../assets/icons/BioTrace (4).png" type="image/png">
    <link rel="stylesheet" href="../painel_admin/css/styles.css">
    <script src="../painel_admin/js/utils.js"></script>
    <script src="../js/sessao.js"></script>

</head>

<body>
    <header class="cabecalho">
        <div class="cabecalho-marca">
            <img src="../assets/icons/BioTrace (4).png" alt="Logo BioTrace" class="logo-biotrace">

            <div class="cabecalho-logo-texto">
                <h1>Painel Interno</h1>
            </div>
        </div>

        <div class="cabecalho-usuario">
            <div class="cabecalho-usuario-info">
                <p id="b_usuario">Olá, nomeUser</p>
            </div>
            <button class="btn-sair" onclick="limparSessao()">Sair</button>
        </div>
    </header>

    <main class="conteudo">
        <div class="conteudo-principal">
            <div class="boas-vindas">
                <h2>Bem-vindo ao Painel Administrativo</h2>
                <p>Gerencie as informações e acesse os recursos internos do BioTrace.</p>
            </div>

            <div class="cards-container">
                <div class="card-acao">
                    <div class="card-icone">🏢</div>
                    <h3>Cadastrar Hospital</h3>
                    <p>Adicione um novo hospital ao sistema preenchendo as informações e permissões necessárias.</p>
                    <a href="cadastrar-hospital.html" class="btn-card">Novo Hospital</a>
                </div>

                <!-- <div class="card-acao">
                    <div class="card-icone">📋</div>
                    <h3>Hospitais Cadastrados</h3>
                    <p>Visualize, edite ou remova os hospitais monitorados pelo BioTrace.</p>
                    <a href="listar-hospitais.html" class="btn-card btn-secundario">Ver Lista</a>
                </div> -->
            </div>
        </div>
    </main>

    <script src="../painel_admin/js/utils.js"></script>

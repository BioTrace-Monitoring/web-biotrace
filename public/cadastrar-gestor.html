<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BioTrace | Cadastro</title>

    <script src="js/sessao.js"></script>

    <link rel="stylesheet" href="css/style_cadastro_empresa.css">

</head>

<body>

    <header class="cabecalho">
        <a href="./painel_admin/index.html"><button class="btn-voltar">Voltar</button></a>
    </header>

    <div class="container">

        <div class="box-cad">

            <h1>Cadastrar Gestor</h1>
            <p class="subtitulo-cad">
                Cadastre um gestor para a empresa correspondente.
            </p>

            <div class="form-cad">

                <div class="empresa">

                    <div class="campo-cad">
                        <label for="">Nome completo</label>
                        <input type="text" id="ipt_nome_user" placeholder="Julia Araripe">
                    </div>
                    <div class="campo-cad">
                        <label for="ipt_cargo_user">Cargo</label>
                        <select id="ipt_cargo_user">
                            <option value="">Selecione o cargo</option>
                        </select>
                    </div>

                    <div class="campo-cad">
                        <label for="">Data de nascimento</label>
                        <input type="text" id="ipt_dt_nasc_user" inputmode="numeric" placeholder="00/00/0000"
                            maxlength="10">
                    </div>

                    <div class="campo-cad">
                        <label for="">Telefone</label>
                        <input type="text" id="ipt_telefone_user" inputmode="numeric" placeholder="(00) 00000-0000"
                            maxlength="11">
                    </div>

                    <div class="campo-cad">
                        <label for="">CPF</label>
                        <input type="text" id="ipt_cpf_user" inputmode="numeric" placeholder="000.000.000-00"
                            maxlength="11">
                    </div>

                    <div class="campo-cad">
                        <label for="">E-mail corporativo</label>
                        <input type="email" id="ipt_email_user" placeholder="seuemail@email.com">
                    </div>

                    <div class="campo-cad">
                        <label for="">Senha</label>
                        <input type="password" id="ipt_senha_user" placeholder="Mínimo 8 caracteres" maxlength="8">
                    </div>

                    <div class="campo-cad">
                        <label for="">Confirmar senha</label>
                        <input type="password" id="ipt_conf_senha_user" placeholder="Repita a senha" maxlength="8">
                    </div>

                </div>


            </div>

            <button class="btn-cad" onclick="cadastrarUsuario()">Cadastrar gestor</button>

        </div>

    </div>



</body>

<script>
    let cargos = [];

    async function buscarCargos() {
        const resposta = await fetch("/usuario/cargos");
        cargos = await resposta.json();

        const select = document.getElementById("ipt_cargo_user");

        cargos.forEach(cargo => {
            const option = document.createElement("option");

            option.value = cargo.id;
            option.textContent = cargo.nome;

            select.appendChild(option);
        });
    }

    buscarCargos();

    function cadastrarUsuario() {
        // Recupera o id da empresa que foi salvo na sessão na tela anterior
        var idEmpresa = sessionStorage.ID_EMPRESA;

        // Captura os valores digitados nos campos do formulário
        var nomeUserVar = ipt_nome_user.value;
        var dataBruta = ipt_dt_nasc_user.value;

        // Separa dia, mês e ano da data digitada
        var dia = dataBruta[0] + dataBruta[1]; // extrai o dia da string
        var mes = dataBruta[3] + dataBruta[4]; // extrai o mes da string
        var ano = dataBruta[6] + dataBruta[7] + dataBruta[8] + dataBruta[9] // extrai o ano da string

        // reorganiza a data para formato AAAA-MM-DD (como deve ser pra inserir uma data no mysql)
        var nascimentoUserVar = ano + `-` + mes + `-` + dia;

        var telefoneUserVar = ipt_telefone_user.value;
        var cargoUserVar = ipt_cargo_user.value;
        var cpfUserVar = ipt_cpf_user.value;
        var emailUserVar = ipt_email_user.value;
        var senhaUserVar = ipt_senha_user.value;
        var confirmacaoSenhaUserVar = ipt_conf_senha_user.value;

        // Verifica se algum campo está vazio
        if (nomeUserVar == "" || dataBruta == "" || telefoneUserVar == "" || cpfUserVar == "" ||
            emailUserVar == "" || senhaUserVar == "" || confirmacaoSenhaUserVar == "" || cargoUserVar == "") {
            alert(`Verifique campos em branco`);
            return false; // Interrompe a função
        }

        // Verifica o tamanho mínimo do nome
        else if (nomeUserVar.length < 3) {
            alert(`Seu nome deve ter mais de 1 caractere`);
            return false; // Interrompe a função
        }

        // Verifica se a data está no formato esperado
        else if (!dataBruta.includes('/')) {
            alert(`Certifique-se que sua data de nascimento está seguindo esse formato: DD/MM/AAAA`);
            return false; // Interrompe a função
        }

        // Verifica se o e-mail possui elementos básicos de um endereço válido
        else if (!emailUserVar.includes("@") || !emailUserVar.includes(".com")) {
            alert(`Certifique-se que seu e-mail contenha "@" e ".com"`);
            return false; // Interrompe a função
        }

        // Verifica se a senha e a confirmação são iguais
        else if (confirmacaoSenhaUserVar != senhaUserVar) {
            alert(`Sua senha não está igual`)
            return false; // Interrompe a função
        }

        else {
            // Faz a requisição
            // quando o servidor responder
            // verifica se deu ok
            // converte o conteúdo
            // usa os dados
            // se qualquer coisa der errado no caminho -> cai no catch

            // Envia os dados do gestor para a rota de cadastro de usuário
            fetch("/usuario/cadastrar-usuario",
                {
                    method: "POST", // Método utilizado para envio de dados
                    headers: {
                        "Content-Type": "application/json", // Informa que os dados estão sendo enviados em JSON
                    },

                    // Converte os dados JavaScript para JSON e envia para o controller
                    body: JSON.stringify({
                        nomeUserServer: nomeUserVar,
                        nascimentoUserServer: nascimentoUserVar,
                        telefoneUserServer: telefoneUserVar,
                        cpfUserServer: cpfUserVar,
                        emailUserServer: emailUserVar,
                        senhaUserServer: senhaUserVar,
                        idEmpresaServer: idEmpresa,
                        cargoUserServer: cargoUserVar
                    }),
                })
                // Executado quando o servidor retorna uma resposta
                .then(function (resposta) {
                    // Cadastro bem-sucedido: avisa o user e redireciona depois de 1 segundo
                    if (resposta.ok) {
                        // Remove o id temporário da empresa armazenado na sessão
                        sessionStorage.removeItem("ID_EMPRESA");

                        alert("Cadastro realizado com sucesso!");

                        setTimeout(() => {
                            window.location = "inicio.html";
                        }, 1000);
                    }

                    else {
                        // Exibe mensagem caso o cadastro não seja realizado
                        throw alert("Houve um erro ao tentar realizar o cadastro!");
                    }
                })
                // Executado caso ocorra algum erro durante a requisição
                .catch(function (resposta) {
                    alert(`#ERRO: ${resposta}`);
                });
        }
    }

</script>

</html>
